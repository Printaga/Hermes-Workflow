      box.appendChild(runLine("p", "Or paste the step's result here and press resume — no chat needed.", "hint"));
      var area = document.createElement("textarea");
      area.rows = 3;
      area.placeholder = "paste the step's output (a JSON object is passed as structured)";
      area.setAttribute("aria-label", "result for agent step " + step.node_id);
      box.appendChild(area);
      var send = runButton("Send result & resume", function () { respond(step.node_id, area.value); });
      send.title = TIPS["runs.resume"];
      box.appendChild(send);
      box.appendChild(runLine("p", "Or run this workflow from chat and the agent executes the step for you.", "hint"));
      return;
    }
    if (status === "failed") {
      var error = result.error || {};
      banner("Run " + runId + " failed — " + (error.node_id ? error.node_id + ": " : "") + (error.msg || ""), "error");
      box.appendChild(runLine("h4", "run failed"));
      box.appendChild(runLine("pre", (error.node_id ? error.node_id + ": " : "") + (error.msg || "")));
      // A diagnosed failure gets a labelled chip; the hint is the chip's tooltip and the
      // raw message above stays the evidence. No diagnosis, no chip — as before.
      if (error.kind) {
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = error.kind;
        chip.title = error.hint || "diagnosed failure kind";
        box.appendChild(chip);
      }
      var retryRun = runButton("Retry run", function () { retryFailedRun(); });
      retryRun.title = TIPS["runs.retry"];
      box.appendChild(retryRun);
      return;
    }
    if (status === "done") {
      var outputs = result.outputs || {};
      banner("Run " + runId + " finished · outputs: " + (Object.keys(outputs).join(", ") || "(none)"), "");
      box.appendChild(runLine("h4", "done · outputs: " + (Object.keys(outputs).join(", ") || "(none)")));
      box.appendChild(runLine("pre", JSON.stringify(outputs, null, 2)));
      return;
    }
    banner("Run " + runId + " · " + String(status || "unknown"), "warn");
    box.appendChild(runLine("h4", String(status || "run")));
    if (result.error) {
      box.appendChild(runLine("pre", typeof result.error === "string" ? result.error : JSON.stringify(result.error)));
    }
  }

  /** Let the host agent produce the parked step's output (the facade a Run uses), then keep
   *  going; when the backend is absent the route answers 503 and the banner says so. */
  function respondByAgent(nodeId) {
    if (!lastRunId) {
      banner("There is no paused run to answer.", "error");
      return;
    }
    if (!window.fetch) {
      banner("Cannot resume — this page has no way to reach the backend.", "error");
      return;
    }
    note("asking the agent…");
    banner("Asking the agent to run step " + nodeId + " of run " + lastRunId + "…", "");
    window.fetch(API + "/runs/" + encodeURIComponent(lastRunId) + "/respond", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ run_id: lastRunId, node_id: nodeId, agent_generate: true }),
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, body: data }; });
    }).then(function (out) {
      if (!out.ok) {
        var detail = (out.body && out.body.detail) || "the request failed";
        banner("Could not resume — " + detail, "error");
        note("");
        return;
      }
      renderRun(out.body || {});
    }).catch(function (err) {
      var detail = err && err.message ? err.message : String(err);
      banner("Could not resume — " + detail, "error");
      note("");
    });
  }

  /** Re-run a failed run from the step it failed on: the runner re-enters there and keeps
   *  everything that already produced output. Only a failed run is retried — a parked gate
   *  is answered, not restarted. Absent backend → the banner says the request failed. */
  function retryFailedRun() {
    if (!lastRunId || lastStatus !== "failed") {
      banner("There is no failed run to retry.", "error");
      return;
    }
    if (!window.fetch) {
      banner("Cannot retry — this page has no way to reach the backend.", "error");
      return;
    }
    note("retrying…");
    banner("Retrying run " + lastRunId + " from the failed step…", "");
    window.fetch(API + "/runs/" + encodeURIComponent(lastRunId) + "/retry", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, body: data }; });
    }).then(function (out) {
      if (!out.ok) {
        var detail = (out.body && out.body.detail) || "the request failed";
        banner("Could not retry — " + detail, "error");
        note("");
        return;
      }
      renderRun(out.body || {});
    }).catch(function (err) {
      var detail = err && err.message ? err.message : String(err);
      banner("Could not retry — " + detail, "error");
      note("");
    });
  }

  /** Feed a paused step's answer back in; the run panel stays mounted so it can continue. */
  function respond(nodeId, answer) {
    if (!lastRunId) {
      banner("There is no paused run to answer.", "error");
      return;
    }
    if (!window.fetch) {
      banner("Cannot resume — this page has no way to reach the backend.", "error");
      return;
    }
    var body = { run_id: lastRunId, node_id: nodeId, answer: answer };
    if (answer && typeof answer === "string" && answer.trim().charAt(0) === "{") {
      // A JSON object is passed as `structured` so downstream conditions can read fields.
      try {
        var parsed = JSON.parse(answer);
        if (parsed && typeof parsed === "object") {
          body = { run_id: lastRunId, node_id: nodeId, structured: parsed, answer: answer };
        }
      } catch (ignored) {
        /* not JSON: send the text */
      }
    }
    note("resuming…");
    banner("Resuming run " + lastRunId + "…", "");
    window.fetch(API + "/runs/" + encodeURIComponent(lastRunId) + "/respond", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, body: data }; });
    }).then(function (out) {
      if (!out.ok) {
        var detail = (out.body && out.body.detail) || "the request failed";
        banner("Could not resume — " + detail, "error");
        note("");
        return;
      }
      renderRun(out.body || {});
    }).catch(function (err) {
      var detail = err && err.message ? err.message : String(err);
      banner("Could not resume — " + detail, "error");
      note("");
    });
  }

  /** Run the saved design now. An unsaved draft is refused with a sentence, not a 404. */
  function runDesign() {
    var name = (graph.name || "").trim();
    if (!name) {
      banner("Name the workflow before running it.", "error");
      return;
    }
    if (!window.fetch) {
      banner("Run failed — this page has no way to reach the backend.", "error");
      return;
    }

    function sendRun() {
      note("running " + name + "…");
      banner("Running “" + name + "”…", "");
      window.fetch(API + "/designs/" + encodeURIComponent(name) + "/run", {
        method: "POST", credentials: "same-origin",
      }).then(function (res) {
        return res.json().then(function (body) { return { ok: res.ok, body: body }; });
      }).then(function (out) {
        if (!out.ok) {
          var detail = (out.body && out.body.detail) || "the request failed";
          showErrors([{ node: "", field: "run", msg: detail }]);
          note("");
          banner("Run failed — " + detail, "error");
          return;
        }
        if (out.body && out.body.status === "invalid") {
          showErrors(out.body.errors || []);
          note("not run");
          banner("Not run — the design has " + (out.body.errors || []).length + " problem(s).", "error");
          return;
        }
        renderRun(out.body || {});
      }).catch(function (err) {
        var detail = err && err.message ? err.message : String(err);
        showErrors([{ node: "", field: "run", msg: detail }]);
        note("");
        banner("Run failed — " + detail, "error");
      });
    }

    if (savedNames && savedNames.indexOf(name) < 0) {
      // The list was fetched when this page loaded; a design saved from chat since then
      // would be falsely refused. Ask once more, and let the POST decide if it cannot answer.
      refreshDesigns().then(function () {
        if (savedNames && savedNames.indexOf(name) < 0) {
          showErrors([{ node: "", field: "name", msg: name + " is not saved yet" }]);
          note("not run");
          banner("“" + name + "” is not saved yet — press Save to Hermes, then Run.", "error");
          return;
        }
        sendRun();
      });
      return;
    }
    sendRun();
  }

  /** Validate against the server when it is reachable (it is the authority), locally otherwise.
   *  A request that fails is said out loud instead of quietly doing nothing. */
  function validateNow() {
    if (!window.fetch) {
      reportValid(validateGraph(graph));
      return;
    }
    var name = (graph.name || "").trim() || "untitled";
    note("validating…");
    window.fetch(API + "/designs/" + encodeURIComponent(name) + "/validate", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ graph: { name: graph.name || "workflow", nodes: graph.nodes } }),
    }).then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, body: body }; });
    }).then(function (out) {
      if (!out.ok) {
        var detail = (out.body && out.body.detail) || "the request failed";
        showErrors([{ node: "", field: "validate", msg: detail }]);
        note("");
        banner("Validate failed — " + detail, "error");
        return;
      }
      var errors = (out.body && out.body.errors) || [];
      showErrors(errors);
      if (!errors.length) {
        note("valid");
        banner("Design is valid · " + graph.nodes.length + " node(s).", "");
      } else {
        note(errors.length + " problem(s)");
        banner("Not valid · " + errors.length + " problem(s) — see the details below the canvas.", "error");
      }
    }).catch(function (err) {
      if (err && err.name === "TypeError") {
        // No HTTP response at all (a bare file:// preview): the local validator is the
        // only authority left. Any other failure means the backend did answer badly and
        // must be said out loud rather than misreported as a local verdict.
        reportValid(validateGraph(graph));
        return;
      }
      var detail = err && err.message ? err.message : String(err);
      showErrors([{ node: "", field: "validate", msg: detail }]);
      note("");
      banner("Validate failed — " + detail, "error");
    });
  }

  // -------------------------------------------------------------- commands
  function addNode(kind, x, y) {
    var index = 0, id;
    do {
      index += 1;
      id = kind + index;
    } while (node(id));
    var fresh = { id: id, type: kind, after: [] };
    if (kind === "trigger") { fresh.trigger_mode = "manual"; }
    if (kind === "agent") { fresh.prompt = ""; }
    if (kind === "condition") { fresh.expression = ""; }
    if (kind === "approval") { fresh.question = ""; }
    if (kind === "note") { fresh.text = ""; }
    if (typeof x === "number" && typeof y === "number") {
      fresh.x = Math.max(0, Math.round(x - NODE_W / 2));
      fresh.y = Math.max(0, Math.round(y - NODE_H / 2));
    } else {
      var slot = graph.nodes.length;
      fresh.x = 26 + (slot % 4) * 172;
      fresh.y = 28 + Math.floor(slot / 4) * 92;
    }
    graph.nodes.push(fresh);
    selected = id;
    selectedEdge = null;
    setInspector(true);
    buildInspector();
    draw();
  }

  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); },
          function () { resolve(legacyCopy(text)); });
      } else {
        resolve(legacyCopy(text));
      }
    });
  }

  function legacyCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "readonly");
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(area);
    return ok;
  }

  function designerJson() {
    return JSON.stringify({ name: graph.name || "workflow", nodes: graph.nodes }, null, 2);
  }

  function saveToHermes() {
    var errors = validateGraph(graph);
    showErrors(errors);
    if (errors.length) { return; }
    var payload = "/workflow save " + (graph.name || "workflow") + " " + JSON.stringify(
      { name: graph.name || "workflow", nodes: graph.nodes });
    if (typeof window.hermes !== "undefined" && window.hermes &&
        typeof window.hermes.send === "function") {
      window.hermes.send(payload);
      note("Sent to Hermes: /workflow save " + (graph.name || "workflow"));
      return;
    }
    copyText(payload).then(function (ok) {
      note(ok
        ? "No Hermes host here — copied the save command; paste it into chat."
        : "No Hermes host and clipboard is blocked — use Copy JSON instead.");
    });
  }

  function loadExample() {
    graph = clone(DEFAULT_GRAPH);
    layout();
    selected = null;
    selectedEdge = null;
    linkArm = null;
    setInspector(false);
    document.getElementById("name").value = graph.name;
    buildInspector();
    draw();
    showErrors([]);
    banner("");
  }

  // ------------------------------------------------------------- wiring up
  function wire() {
    document.getElementById("name").addEventListener("input", function (ev) {
      graph.name = ev.target.value.trim();
    });

    document.getElementById("validate").addEventListener("click", validateNow);
    document.getElementById("run").addEventListener("click", runDesign);

    document.getElementById("copy").addEventListener("click", function () {
      var text = designerJson();
      copyText(text).then(function (ok) {
        note(ok ? "designer JSON copied (" + text.length + " chars)"
          : "clipboard blocked — select the JSON in the console instead");
        if (!ok && window.console) { console.log(text); }
      });
    });

    document.getElementById("name").title = TIPS["bar.name"];
    document.getElementById("validate").title = TIPS["bar.validate"];
    document.getElementById("copy").title = "Copy this graph's designer JSON to the clipboard.";
    document.getElementById("load").title = "Load the bundled hello-world example graph.";
    document.getElementById("save").title = "Hand the designer JSON to Hermes as a workflow save message.";
    document.getElementById("load").addEventListener("click", loadExample);
    document.getElementById("save").addEventListener("click", saveToHermes);
    document.getElementById("run").title = "Run the saved workflow now and report the outcome above the canvas.";

    document.getElementById("insp-toggle").addEventListener("click", function () {
      setInspector(document.getElementById("app").classList.contains("collapsed"));
    });

    Array.prototype.forEach.call(
      document.querySelectorAll("#kit [data-kind]"),
      function (button) {
        var kind = button.getAttribute("data-kind");
        button.title = TIPS[kind] || kind;
        button.addEventListener("click", function () { addNode(kind); });
        button.addEventListener("dragstart", function (ev) {
          ev.dataTransfer.setData("text/plain", kind);
          ev.dataTransfer.effectAllowed = "copy";
        });
      }
    );

    var wrap = document.getElementById("canvaswrap");
    wrap.addEventListener("dragover", function (ev) {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = "copy";
    });
    wrap.addEventListener("drop", function (ev) {
      ev.preventDefault();
      var kind = ev.dataTransfer.getData("text/plain");
      if (PALETTE.indexOf(kind) < 0) { return; }
      var p = svgPoint(ev);
      addNode(kind, p.x, p.y);
    });

    document.addEventListener("keydown", function (ev) {
      var target = ev.target || {};
      // A focused button (palette, dismiss, inspector toggle, run panel) is not a canvas
      // focus: Delete there must not silently remove the selected node or edge.
      if (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(target.tagName || "")) { return; }
      if (target.isContentEditable) { return; }
      if (ev.key !== "Delete" && ev.key !== "Backspace") { return; }
      if (!selected && !selectedEdge) { return; }
      ev.preventDefault();
      removeSelected();
    });
  }

  wire();
  watchSize();
  layout();
  buildInspector();
  draw();
  refreshProfiles();
  refreshModels();
  refreshDesigns();
  refreshChannels();
}());
</script>
</body>
</html>
