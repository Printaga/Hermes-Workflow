<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>visual workflow designer</title>
<style>
  /* Theme comes from the host page. No page background, no webfonts. */
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--foreground, #d8d8d8);
    text-align: left;
  }
  #app {
    display: flex; flex-direction: column; height: 100%;
    /* Sticky-note tints. Each mixes a fixed hue with the host card so the label stays
       readable in a light or dark theme instead of pinning a raw colour. */
    --vw-note-yellow: color-mix(in srgb, #f2d16b 22%, var(--card, #1e1e1e));
    --vw-note-blue: color-mix(in srgb, #6ea8fe 22%, var(--card, #1e1e1e));
    --vw-note-green: color-mix(in srgb, #34d399 22%, var(--card, #1e1e1e));
    --vw-note-red: color-mix(in srgb, #fb2c36 22%, var(--card, #1e1e1e));
    --vw-danger: #fb2c36;
  }
  #bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border, #3a3a3a);
  }
  #bar .grow { flex: 1 1 180px; min-width: 120px; }
  #main { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; }
  /* flex: 0 0 auto keeps the node bar a fixed row: as a growing item it filled the height
     the canvas gave up when a node was selected, leaving a band of nothing above the canvas. */
  #kit {
    display: flex; gap: 4px; align-items: center; overflow-x: auto;
    flex: 0 0 auto;
    padding: 6px 0; border-bottom: 1px solid var(--border, #3a3a3a);
  }
  #kit .tool {
    display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
    white-space: nowrap; cursor: grab;
  }
  #kit .ico { font-size: 12px; line-height: 1; }
  #kit .hint {
    margin: 0 0 0 auto; padding-left: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* The canvas asks for its own band, so opening the inspector cannot take it away. */
  #canvaswrap {
    flex: 1 1 auto; min-width: 0; overflow: auto; padding: 6px;
    min-height: clamp(320px, calc(100dvh - 240px), 900px);
  }
  #inspector {
    width: 252px; flex: 0 0 auto; box-sizing: border-box; padding: 4px 0 8px 10px;
    border-left: 1px solid var(--border, #3a3a3a); overflow: auto;
  }
  #insp-toggle {
    font: inherit; color: var(--muted-foreground, #9a9a9a); background: none;
    border: 0; padding: 2px 4px; cursor: pointer; text-align: left;
  }
  #insp-toggle:hover { color: var(--foreground, #d8d8d8); }
  #app.collapsed #inspector { width: 30px; padding: 4px 2px; overflow: hidden; }
  #app.collapsed #insp-body { display: none; }
  #app.collapsed #insp-toggle {
    writing-mode: vertical-rl; height: 100%; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  /* A run's outcome must not be a word that scrolls away: pinned above the canvas,
     announced, dismissed by its own button. */
  #banner {
    display: flex; gap: 8px; align-items: flex-start; margin: 6px 0 0;
    padding: 6px 8px; border: 1px solid var(--border, #3a3a3a);
    border-left: 3px solid var(--accent, #6ea8fe);
    color: var(--foreground, #d8d8d8); white-space: pre-wrap;
    max-height: 120px; overflow: auto;
  }
  #banner[hidden] { display: none; }
  #banner.warn { border-left-color: var(--vw-note-yellow); }
  #banner.error { border-left-color: var(--vw-danger); color: var(--vw-danger); }
  #banner p { margin: 0; flex: 1 1 auto; min-width: 0; }
  #errors {
    margin: 0; padding: 6px 0; max-height: 108px; overflow: auto;
    white-space: pre-wrap; border-top: 1px solid var(--border, #3a3a3a);
    color: var(--muted-foreground, #9a9a9a);
  }
  /* One-word status is separate from the validation detail list: writing the word into
     #errors used to erase the problems the banner told the reader to look at. */
  #status {
    margin: 0; padding: 2px 0; font-size: 11px;
    color: var(--muted-foreground, #9a9a9a);
  }
  button.pill, select, input[type=text], textarea {
    font: inherit; color: inherit; background: var(--card, #1e1e1e);
    border: 1px solid var(--border, #3a3a3a); border-radius: 6px;
    padding: 3px 7px;
  }
  button.pill { cursor: pointer; }
  button.pill:hover { border-color: var(--accent, #6ea8fe); }
  input[type=text], textarea, select { width: 100%; box-sizing: border-box; }
  textarea { resize: vertical; }
  .muted { color: var(--muted-foreground, #9a9a9a); }
  .label { color: var(--muted-foreground, #9a9a9a); font-size: 11px; margin: 8px 0 2px; }
  .hint { color: var(--muted-foreground, #9a9a9a); font-size: 11px; margin: 2px 0 0; }
  /* The diagnosed-failure chip next to a failed run's error text; the hint rides the title. */
  .chip {
    display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 9px;
    font-size: 11px; line-height: 18px;
    border: 1px solid var(--border, #3a3a3a); background: var(--card, #1e1e1e);
    color: var(--muted-foreground, #9a9a9a);
  }
  #canvas { display: block; }
  #canvas .node { cursor: grab; }
  #canvas .node:active { cursor: grabbing; }
  #canvas .port {
    fill: var(--card, #1e1e1e); stroke: var(--border, #3a3a3a);
    stroke-width: 1.5; cursor: crosshair;
  }
  #canvas .port:hover { fill: var(--accent, #6ea8fe); stroke: var(--accent, #6ea8fe); }
  #canvas .edge { fill: none; stroke: var(--border, #3a3a3a); stroke-width: 1.6; }
  #canvas .edge-on { stroke: var(--accent, #6ea8fe); stroke-width: 2.4; }
  #canvas .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  #canvas .ghost {
    fill: none; stroke: var(--accent, #6ea8fe); stroke-width: 1.6; stroke-dasharray: 4 3;
  }
  /* The run panel is separate from the validation list: a paused run must stay visible and
     carry its own result box, not scroll away as one more error line. */
  #run { padding: 8px; border-top: 1px solid var(--border, #3a3a3a); }
  #run[hidden] { display: none; }
  #run h4 { margin: 0 0 4px; font-size: 12px; }
  #run pre { margin: 4px 0; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  #run textarea { margin: 4px 0; }
</style>
</head>
<body>
<div id="app" class="collapsed">
  <div id="kit">
    <!-- click adds at a free slot, drag drops at the pointer -->
    <button class="pill tool" type="button" draggable="true" data-kind="trigger"><span class="ico">▶</span>Trigger</button>
    <button class="pill tool" type="button" draggable="true" data-kind="agent"><span class="ico">✦</span>Agent</button>
    <button class="pill tool" type="button" draggable="true" data-kind="condition"><span class="ico">◇</span>Condition</button>
    <button class="pill tool" type="button" draggable="true" data-kind="approval"><span class="ico">✓</span>Approval</button>
    <button class="pill tool" type="button" draggable="true" data-kind="output"><span class="ico">▤</span>Output</button>
    <button class="pill tool" type="button" draggable="true" data-kind="note"><span class="ico">✎</span>Note</button>
    <p class="hint">Click a node to add it, or drag it onto the canvas. Drag a node&rsquo;s right port to another node&rsquo;s left port.</p>
  </div>
  <div id="bar">
    <input id="name" class="grow" type="text" value="hello-world" aria-label="design name">
    <button class="pill" id="validate" type="button">Validate</button>
    <button class="pill" id="run" type="button">Run</button>
    <button class="pill" id="copy" type="button">Copy JSON</button>
    <button class="pill" id="load" type="button">Load example</button>
    <button class="pill" id="save" type="button" data-hermes-send="workflow save">Save to Hermes</button>
  </div>
  <div id="main">
    <div id="canvaswrap">
      <svg id="canvas" role="img" aria-label="workflow canvas"></svg>
    </div>
    <div id="inspector">
      <button id="insp-toggle" type="button" aria-expanded="false" aria-controls="insp-body">Inspector</button>
      <div id="insp-body"></div>
    </div>
  </div>
  <div id="banner" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <pre id="errors" hidden></pre>
  <p id="status" hidden></p>
  <div id="run" hidden></div>
</div>

<script id="default-graph" type="application/json">
{"name":"hello-world","nodes":[
  {"id":"trigger1","type":"trigger","trigger_mode":"manual","after":[]},
  {"id":"writer","type":"agent","prompt":"Write a haiku about rivers.","after":["trigger1"]},
  {"id":"out","type":"output","after":["writer"]}
]}
</script>

<script>
(function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var KINDS = ["trigger", "agent", "condition", "approval", "output"];
  // A sticky note: legal canvas content, never a step. `KINDS` stays the five runnable kinds
  // (the palette list below adds the note), so nothing that validates or converts a workflow
  // can mistake an annotation for work. Mirrors NOTE_KIND in visual_workflow_hermes/schema.py.
  var NOTE = "note";
  var NOTE_COLORS = ["yellow", "blue", "green", "red"];
  var PALETTE = KINDS.concat([NOTE]);
  var MODES = ["manual", "schedule"];

  // ---- tooltips -------------------------------------------------------------
  // One table, one wording, all three surfaces (dashboard/dist/index.js, desktop/plugin.js,
  // widgets/designer.html). A native `title` is the smallest mechanism that works in a hosted
  // page, inside SVG and in a standalone file alike; tests/test_tooltips.py asserts every node
  // kind and every inspector option has a real sentence here.
  var TIPS = {
    trigger: "Starts the run: by hand when you press Run, or on a Hermes schedule you pick.",
    agent: "Asks a bot to do one step and waits for its reply.",
    condition: "Compares a field from an earlier step and skips the branch when the test fails.",
    approval: "Pauses the run and asks a person to choose or type an answer.",
    output: "Collects the results, and can send them to one of your chats.",
    note: "A label for you or a teammate: it sits on the canvas and never runs.",
    "trigger.trigger_mode": "How the run starts: manual (you press Run) or schedule (a real Hermes cron job).",
    "trigger.preset": "Pick a schedule in plain words: every day, Monday to Friday, once a week, every hour, or advanced cron.",
    "trigger.time": "Local time of day for the schedule, 24-hour HH:MM (e.g. 09:30).",
    "trigger.weekday": "Day of the week a weekly schedule runs on.",
    "trigger.schedule": "The cron expression actually saved: minute hour day-of-month month weekday — 0 9 * * 1-5 is 09:00 Monday to Friday.",
    "agent.prompt": "What this step should do; the reply becomes out.<node>.text for later steps.",
    "agent.profile": "Which bot runs the step; host default uses the bot you have active.",
    "agent.model": "Model override for this step only; empty keeps the bot's own model.",
    "agent.retries": "How many extra tries the step gets when the bot fails before the run gives up (0 to 3).",
    "condition.expression": "Pick the step, field, operator and value above — or type the test as out.<node>.<field> <op> <value>.",
    "approval.question": "The question the person sees; the run waits here until they answer.",
    "approval.context": "The material the person is deciding on, shown with the question when the run pauses.",
    "approval.options": "Answers offered as buttons, comma separated (e.g. ship, edit); empty means free text.",
    "approval.timeout": "How long to wait for a person before the gate expires, in minutes; empty waits forever.",
    "approval.on_timeout": "What an expired gate does: reject fails the run, escalate flags it for a person.",
    "output.parents": "Steps whose results this output collects — connect an edge instead of typing here.",
    "output.send_to": "One choice: collect only, a home channel for a notification, or one specific chat.",
    "output.target": "Where it goes: a platform for its home channel, or platform:chat id like telegram:8522302999.",
    "runs.approve": "Answer this gate now; the run resumes from where it stopped.",
    "runs.resume": "Paste the agent step's result here and resume the run right where it paused.",
    "runs.agent": "Let the host agent produce this step's output now, then resume right where it paused.",
    "runs.retry": "Re-run this failed run from the step that failed; steps that already finished are kept.",
    "note.text": "What the sticky says; it is only for the person reading the canvas.",
    "note.color": "Tint for the sticky; it is a reading aid, not part of the run.",
    "schedule.save": "Create or update the real Hermes cron job that replays this saved workflow.",
    "bar.name": "Name this workflow is saved and run under.",
    "bar.validate": "Check the graph without saving it.",
    "presets.daily": "Runs once every day at the time you pick.",
    "presets.weekdays": "Runs Monday to Friday at the time you pick.",
    "presets.weekly": "Runs once a week on the day and time you pick.",
    "presets.hourly": "Runs every hour at the minute you pick.",
    "presets.custom": "Type a cron expression yourself; it is checked as you type.",
  };

  // ---- friendly scheduler helpers (mirror visual_workflow_hermes/schedule.py) ----
  var PRESETS = ["daily", "weekdays", "weekly", "hourly", "custom"];
  var PRESET_LABELS = {
    daily: "Every day",
    weekdays: "Monday to Friday",
    weekly: "Once a week",
    hourly: "Every hour",
    custom: "Advanced (cron)"
  };
  var WEEKDAYS = [
    ["mon", "Monday"], ["tue", "Tuesday"], ["wed", "Wednesday"], ["thu", "Thursday"],
    ["fri", "Friday"], ["sat", "Saturday"], ["sun", "Sunday"]
  ];
  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var CRON_FIELDS = [
    ["minute", 0, 59], ["hour", 0, 23], ["day-of-month", 1, 31], ["month", 1, 12],
    ["day-of-week", 0, 7]
  ];

  function pad2(value) { return (value < 10 ? "0" : "") + value; }

  /** "09:30" -> [9, 30]; null when it is not a 24h HH:MM. */
  function timeParts(value) {
    var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(value || "").trim());
    return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null;
  }

  function weekdayIndex(name) {
    var key = String(name || "").slice(0, 3).toLowerCase();
    var i = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"].indexOf(key);
    return i < 0 ? 1 : i;
  }

  /** Preset picker values -> the cron expression that gets saved. */
  function buildCron(preset, time, weekday, custom) {
    if (preset === "custom") { return String(custom || "").trim(); }
    var parts = timeParts(time);
    if (!parts) { return ""; }
    if (preset === "hourly") { return parts[1] + " * * * *"; }
    if (preset === "daily") { return parts[1] + " " + parts[0] + " * * *"; }
    if (preset === "weekdays") { return parts[1] + " " + parts[0] + " * * 1-5"; }
    return parts[1] + " " + parts[0] + " * * " + weekdayIndex(weekday);
  }

  function cronFieldOk(raw, low, high) {
    var parts = String(raw).split(",");
    for (var i = 0; i < parts.length; i += 1) {
      var part = parts[i].trim();
      if (!part) { return false; }
      if (part.indexOf("/") >= 0) {
        var step = part.split("/");
        // Exactly one step segment: "*/15/2" and "5/10/extra" are not valid cron.
        if (step.length !== 2) { return false; }
        part = step[0];
        if (!/^\d+$/.test(step[1] || "") || parseInt(step[1], 10) < 1) { return false; }
        if (part !== "*" && part.indexOf("-") < 0 && !/^\d+$/.test(part)) { return false; }
      }
      if (part === "*") { continue; }
      if (part.indexOf("-") >= 0) {
        var span = part.split("-");
        if (!/^\d+$/.test(span[0] || "") || !/^\d+$/.test(span[1] || "")) { return false; }
        if (parseInt(span[0], 10) > parseInt(span[1], 10)) { return false; }
        if (parseInt(span[0], 10) < low || parseInt(span[1], 10) > high) { return false; }
        continue;
      }
      if (!/^\d+$/.test(part)) { return false; }
      if (parseInt(part, 10) < low || parseInt(part, 10) > high) { return false; }
    }
    return true;
  }

  /** "" when the expression is a usable 5-field cron, else one line saying why not. */
  function cronProblem(expression) {
    var text = String(expression || "").trim();
    if (!text) { return "enter a cron expression (5 fields, e.g. 0 9 * * 1-5)"; }
    var fields = text.split(/\s+/);
    if (fields.length !== 5) {
      return "cron needs 5 fields (minute hour day month weekday), got " + fields.length;
    }
    for (var i = 0; i < CRON_FIELDS.length; i += 1) {
      var spec = CRON_FIELDS[i];
      if (!cronFieldOk(fields[i], spec[1], spec[2])) {
        return spec[0] + " field " + fields[i] + " is not valid (allowed " + spec[1] + "-" +
          spec[2] + ", *, */n, a-b)";
      }
    }
    return "";
  }

  /** Plain words for a cron expression, so the inspector reads without decoding cron. */
  function describeCron(expression) {
    var text = String(expression || "").trim();
    if (cronProblem(text)) { return text; }
    var f = text.split(/\s+/);
    if (f[2] !== "*" || f[3] !== "*") { return "custom schedule"; }
    if (f[1] === "*") {
      // "* * * * *" is valid cron (no fixed minute), so guard the cast or this reads ":NaN".
      return /^\d+$/.test(f[0]) ? "every hour at :" + pad2(parseInt(f[0], 10)) : "every hour";
    }
    if (!/^\d+$/.test(f[0]) || !/^\d+$/.test(f[1])) { return "custom schedule"; }
    var at = pad2(parseInt(f[1], 10)) + ":" + pad2(parseInt(f[0], 10));
    if (f[4] === "*") { return "every day at " + at; }
    if (f[4] === "1-5") { return "Monday to Friday at " + at; }
    var name = /^\d+$/.test(f[4]) ? DAY_NAMES[parseInt(f[4], 10) % 7] : "";
    return name ? "every " + name + " at " + at : "custom schedule";
  }

  /** The preset a saved cron expression reads as; "custom" when it fits none. */
  function presetOf(expression) {
    var text = String(expression || "").trim();
    if (cronProblem(text)) { return "custom"; }
    var f = text.split(/\s+/);
    if (f[2] !== "*" || f[3] !== "*") { return "custom"; }
    if (f[1] === "*") { return /^\d+$/.test(f[0]) ? "hourly" : "custom"; }
    if (!/^\d+$/.test(f[0]) || !/^\d+$/.test(f[1])) { return "custom"; }
    if (f[4] === "1-5") { return "weekdays"; }
    if (f[4] === "*") { return "daily"; }
    // A list/step weekday has no weekly-picker equivalent; calling it weekly would coerce it.
    return /^\d+$/.test(f[4]) ? "weekly" : "custom";
  }

  function timeOf(expression) {
    var f = String(expression || "").trim().split(/\s+/);
    if (f.length === 5 && /^\d+$/.test(f[0]) && /^\d+$/.test(f[1])) {
      return pad2(parseInt(f[1], 10)) + ":" + pad2(parseInt(f[0], 10));
    }
    return "09:00";
  }

  function weekdayOf(expression) {
    var f = String(expression || "").trim().split(/\s+/);
    if (f.length === 5 && /^\d+$/.test(f[4])) {
      // cron day-of-week is 0=Sunday..6=Saturday (7 is Sunday too); WEEKDAYS starts at Monday.
      var dayName = DAY_NAMES[parseInt(f[4], 10) % 7];
      for (var i = 0; i < WEEKDAYS.length; i += 1) {
        if (WEEKDAYS[i][1] === dayName) { return WEEKDAYS[i][0]; }
      }
    }
    return "mon";
  }
  var MAX_NODES = 50;
  // Compact cards: the preview is often hosted in a narrow pane, so a node is 150x58 and
  // its text preview is at most two short lines.
  var NODE_W = 150, NODE_H = 58;
  var PORT_R = 5;

  // ---- edge geometry (identical in widgets/designer.html, dashboard/dist/index.js and
  // desktop/plugin.js: no build step, so the block is copied rather than imported).
  // Every node has an OUTPUT port on its right edge and — except a trigger, which can have
  // no parents — an INPUT port on its left edge. An edge runs from the parent's output port
  // to the child's input port, so the curve reads as a direction.
  function outPort(n) { return { x: n.x + NODE_W, y: n.y + NODE_H / 2 }; }
  function inPort(n) { return { x: n.x, y: n.y + NODE_H / 2 }; }
  // JSON, not "from>to": an id may itself contain '>', and the key is parsed back when a
  // selected edge is deleted. JSON keeps the pair unambiguous without a charset rule.
  function edgeKey(from, to) { return JSON.stringify([from, to]); }
  function edgePath(parent, child) {
    var p = outPort(parent), q = inPort(child);
    var bend = Math.max(30, Math.abs(q.x - p.x) / 2);
    return "M" + p.x + "," + p.y +
      "C" + (p.x + bend) + "," + p.y + " " + (q.x - bend) + "," + q.y + " " + q.x + "," + q.y;
  }
  var REQUIRED = {
    trigger: ["trigger_mode"], agent: ["prompt"], condition: ["expression"],
    approval: ["question"], output: []
  };
  var DEFAULT_GRAPH = JSON.parse(document.getElementById("default-graph").textContent);

  var graph = clone(DEFAULT_GRAPH);
  var selected = null;
  var selectedEdge = null;
  var linkArm = null;   // source node id after a click on an output port
  var dragLink = null;  // live drag from an output port: {from, x1, y1, x2, y2}
  var profiles = [];    // host profiles ("bots") offered to agent nodes
  var models = [];      // host model catalog: [{slug, label, models}]
  // Slug of the host's active provider ("" when unknown): only its models can
  // actually run, so the picker offers those. Set alongside the catalog.
  var currentProvider = "";
  var channels = [];    // host channel directory: [{id, label, kind, platform}]
  // Latest mounted run's outputs by node id, painted under their nodes by draw().
  // Kept with the run's design name so switching designs never paints stale text.
  var lastOutputs = {};
  var lastRunName = "";
  // Full per-node text of the mounted run (capped): the canvas shows excerpts, the
  // inspector shows everything for the selected node, the run panel keeps it all.
  var lastFull = {};
  var lastRunId = "";   // the run the resume box answers
  var lastStatus = "";  // that run's last seen status: only a failed one is retryable

  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function node(id) { return graph.nodes.filter(function (n) { return n.id === id; })[0] || null; }

  /** One send-to value -> the two fields the backend reads. A bare platform is that
   *  platform's home channel (a notification); anything with a colon is one specific chat.
   *  Deriving both from one value is what makes the invalid pair impossible to build. */
  function applySendTo(node, value) {
    var target = String(value || "").trim();
    delete node.deliver;
    delete node.target;
    if (!target) { return node; }
    node.deliver = target.indexOf(":") === -1 ? "notification" : "channel";
    node.target = target;
    return node;
  }

  /** The picker value a saved node shows: no delivery mode = collect only. */
  function sendToValue(node) {
    return node.deliver ? String(node.target || "") : "";
  }

  function sendToSelect(current) {
    var select = document.createElement("select");
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "collect only — do not send";
    blank.title = TIPS["output.send_to"];
    select.appendChild(blank);
    var value = sendToValue(current);
    var known = false;
    channels.forEach(function (item) {
      var option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.label || item.id;
      option.title = item.id;
      if (item.id === value) { option.selected = true; known = true; }
      select.appendChild(option);
    });
    if (value && !known) {
      // A saved target the gateway has not listed must stay visible, not reset.
      var stale = document.createElement("option");
      stale.value = value;
      stale.textContent = value + " (not listed)";
      stale.title = TIPS["output.target"];
      stale.selected = true;
      select.appendChild(stale);
    }
    select.addEventListener("change", function () {
      applySendTo(current, select.value);
      buildInspector();
      draw();
    });
    return select;
  }

  // ---------------------------------------------------------------- layout
  function layout() {
    graph.nodes.forEach(function (n, i) {
      if (typeof n.x !== "number" || typeof n.y !== "number") {
        n.x = 26 + (i % 4) * 172;
        n.y = 28 + Math.floor(i / 4) * 92;
      }
    });
  }

  /** Notes carry one of a fixed set of tints; anything else reads as the default yellow. */
  function noteColor(n) {
    var name = String(n.color || "").toLowerCase();
    return NOTE_COLORS.indexOf(name) >= 0 ? name : "yellow";
  }

  // ------------------------------------------------------- validator port
  // Same demands as visual_workflow_hermes/schema.py, worded identically so a design
  // that passes here passes in Python.

  /** Ids of the annotation nodes; they take no part in connectivity or cycles. */
  function noteIds(nodes) {
    return (nodes || []).filter(function (n) {
      return n && n.type === NOTE;
    }).map(function (n) {
      return n.id;
    });
  }

  function validateGraph(g) {
    var errors = [];
    if (!g || typeof g !== "object" || Array.isArray(g)) {
      return [{ node: "", field: "graph", msg: "graph must be an object" }];
    }
    var nodes = Array.isArray(g.nodes) ? g.nodes : [];
    if (!nodes.length) {
      return [{ node: "", field: "nodes", msg: "workflow needs at least one node" }];
    }
    if (nodes.length > MAX_NODES) {
      errors.push({ node: "", field: "nodes",
        msg: "design capped at " + MAX_NODES + " nodes, got " + nodes.length });
    }
    var ids = nodes.map(function (n) { return n && n.id; });
    var unique = ids.filter(function (id, i) { return ids.indexOf(id) === i; });
    if (unique.length !== ids.length) {
      errors.push({ node: "", field: "nodes", msg: "node ids must be unique" });
    }
    var annotations = noteIds(nodes);
    var triggers = nodes.filter(function (n) { return n && n.type === "trigger"; });
    if (triggers.length !== 1) {
      errors.push({ node: "", field: "trigger",
        msg: "workflow needs exactly one trigger, found " + triggers.length });
    }
    nodes.forEach(function (n) {
      if (!n || typeof n !== "object") {
        errors.push({ node: "", field: "node", msg: "node must be an object" });
        return;
      }
      var nid = n.id || "", kind = n.type;
      if (kind === NOTE) {
        // Informative only: no required fields, no connectivity, no cycle participation.
        if ((n.after || []).length) {
          errors.push({ node: nid, field: "after",
            msg: "a note takes no edges — it is only information" });
        }
        if (n.color && NOTE_COLORS.indexOf(String(n.color).toLowerCase()) < 0) {
          errors.push({ node: nid, field: "color",
            msg: "color must be one of " + NOTE_COLORS.join(", ") + " or empty" });
        }
        return;
      }
      if (KINDS.indexOf(kind) < 0) {
        errors.push({ node: nid, field: "type",
          msg: "unknown node type '" + kind + "', expected one of " + KINDS.join(", ") });
        return;
      }
      REQUIRED[kind].forEach(function (field) {
        if (!n[field]) {
          errors.push({ node: nid, field: field,
            msg: kind + " node '" + nid + "' needs non-empty '" + field + "'" });
        }
      });
      if (kind === "trigger" && MODES.indexOf(n.trigger_mode) < 0) {
        errors.push({ node: nid, field: "trigger_mode",
          msg: "trigger_mode must be one of " + MODES.join(", ") });
      }
      (n.after || []).forEach(function (dep) {
        if (annotations.indexOf(dep) >= 0) {
          errors.push({ node: nid, field: "after",
            msg: "'" + dep + "' is a note and cannot be a dependency" });
        } else if (ids.indexOf(dep) < 0) {
          errors.push({ node: nid, field: "after", msg: "unknown dependency '" + dep + "'" });
        } else if (dep === nid) {
          errors.push({ node: nid, field: "after", msg: "node cannot depend on itself" });
        }
      });
      var WHEN = /^out\.[A-Za-z0-9_.-]+\s*(==|!=|>=|<=|>|<)\s*.+$/;
      if (kind === "condition" && n.expression && !WHEN.test(String(n.expression).trim())) {
        errors.push({ node: nid, field: "expression",
          msg: "expression must look like 'out.<node>.<field> <op> <value>' (op: == != > >= < <=)" });
      }
    });
    if (!errors.length) {
      var visiting = {}, done = {};
      function visit(nid, stack) {
        if (done[nid]) { return null; }
        if (visiting[nid]) { return stack.concat([nid]); }
        visiting[nid] = true;
        var current = nodes.filter(function (n) { return n && n.id === nid; })[0];
        var deps = (current && current.after) || [];
        for (var i = 0; i < deps.length; i += 1) {
          var cycle = visit(deps[i], stack.concat([nid]));
          if (cycle) { return cycle; }
        }
        delete visiting[nid];
        done[nid] = true;
        return null;
      }
      for (var i = 0; i < ids.length; i += 1) {
        var cycle = visit(ids[i], []);
        if (cycle) {
          errors.push({ node: cycle[0], field: "after",
            msg: "dependency cycle: " + cycle.join(" -> ") });
          break;
        }
      }
    }
    return errors;
  }

  // --------------------------------------------------------------- drawing
  // SVG presentation attributes are parsed as attribute values, where var() is not valid —
  // setAttribute("fill", "var(--card)") computes black. Paint values go through a style
  // declaration instead; every other attribute stays a plain attribute.
  var PAINT_ATTRS = { fill: 1, stroke: 1, "stop-color": 1 };

  function svgEl(name, attrs) {
    var el = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(function (key) {
      var value = attrs[key];
      if (PAINT_ATTRS[key] && String(value).indexOf("var(") >= 0) {
        el.style.setProperty(key, value);
      } else {
        el.setAttribute(key, value);
      }
    });
    return el;
  }

  /** At most two short lines of a node's own text, cut on a word where there is one. */
  function previewLines(n) {
    var text =
      n.type === "note" ? (n.text || "") :
      n.type === "agent" ? (n.prompt || "") :
      n.type === "condition" ? (n.expression || "") :
      n.type === "approval" ? (n.question || "") :
      n.type === "trigger" ? (n.trigger_mode || "") + (n.schedule ? " " + n.schedule : "") :
      (n.after || []).join(", ");
    text = String(text).replace(/\s+/g, " ").trim();
    var lines = [];
    while (text && lines.length < 2) {
      if (text.length <= 22) { lines.push(text); break; }
      var cut = text.lastIndexOf(" ", 22);
      if (cut < 8) { cut = 22; }
      lines.push(text.slice(0, cut).trim());
      text = text.slice(cut).trim();
    }
    if (text && lines.length === 2) { lines[1] = lines[1].slice(0, 21) + "…"; }
    return lines;
  }

  /** One node's last-run output as short canvas lines: strings verbatim, anything
   *  else as JSON, capped before wrapping so a digest cannot bury the canvas.
   *  Slicing is code-point based so emoji never splits into tofu. */
  function summarizeOutputs(result) {
    var out = {};
    var outputs = (result && result.outputs) || {};
    Object.keys(outputs).forEach(function (id) {
      var text = outputs[id];
      text = typeof text === "string" ? text : JSON.stringify(text);
      text = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
      var chars = Array.from(text);
      if (chars.length > 140) { text = chars.slice(0, 139).join("") + "…"; }
      if (text) { out[id] = text; }
    });
    return out;
  }

  /** Full text of one run's outputs by node id, capped so a huge payload cannot
   *  swell the inspector: the run panel keeps the whole thing. Slicing is
   *  code-point based so emoji never splits into tofu. */
  function fullOutputs(result) {
    var out = {};
    var outputs = (result && result.outputs) || {};
    Object.keys(outputs).forEach(function (id) {
      var text = outputs[id];
      text = typeof text === "string" ? text : JSON.stringify(text, null, 2);
      text = String(text == null ? "" : text);
      var chars = Array.from(text);
      if (chars.length > 2000) {
        text = chars.slice(0, 1999).join("") + "… (truncated, full text in run panel)";
      }
      if (text) { out[id] = text; }
    });
    return out;
  }

  /** Wrapped excerpt of one node's last output, or [] when there is nothing to show
   *  (no run yet, or the mounted run belongs to another design). */
  function outputLines(id) {
    if (!lastRunName || lastRunName !== graph.name) { return []; }
    var rest = lastOutputs[id] || "";
    if (!rest) { return []; }
    var lines = [];
    var chars = Array.from(rest);
    while (chars.length && lines.length < 2) {
      if (chars.length <= 22) { lines.push(chars.join("")); break; }
      var cut = chars.lastIndexOf(" ", 22);
      if (cut < 8) { cut = 22; }
      lines.push(chars.slice(0, cut).join("").trim());
      chars = chars.slice(cut);
      while (chars.length && chars[0] === " ") { chars.shift(); }
    }
    if (chars.length && lines.length === 2) {
      lines[1] = Array.from(lines[1]).slice(0, 21).join("") + "…";
    }
    return lines;
  }

  // ------------------------------------------------------- inspector panel
  // Collapsed to a 30px strip by default; a selection opens it, the toggle closes it.
  function setInspector(open) {
    document.getElementById("app").classList.toggle("collapsed", !open);
    var toggle = document.getElementById("insp-toggle");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.textContent = open ? "Inspector »" : "Inspector";
  }

  // ------------------------------------------------------------- fit width
  // The SVG is a fixed virtual sheet whose viewBox is the graph's bounds; the rendered width
  // is the wrapper's, so a narrow pane scales the graph down instead of clipping it. Only
  // width is measured: height follows the aspect ratio and the wrapper scrolls.
  var fitLocked = false;

  function fit() {
    var svg = document.getElementById("canvas");
    var wrap = document.getElementById("canvaswrap");
    var avail = Math.max(240, (wrap.clientWidth || 0) - 12);
    var maxX = 0, maxY = 0;
    graph.nodes.forEach(function (n) {
      maxX = Math.max(maxX, n.x + NODE_W);
      maxY = Math.max(maxY, n.y + NODE_H);
    });
    var width = Math.max(maxX + 30, 320);
    var height = Math.max(maxY + 30, 200);
    var scale = avail / width;
    if (scale > 1) { width = avail; scale = 1; }
    svg.setAttribute("viewBox", "0 0 " + Math.round(width) + " " + Math.round(height));
    svg.setAttribute("width", Math.round(avail));
    svg.setAttribute("height", Math.round(Math.max(200, height * scale)));
    svg.setAttribute("preserveAspectRatio", "xMinYMin meet");
  }

  /** Re-fit when the pane itself is resized (Hermes sidebars opening, window drag). */
  function watchSize() {
    if (typeof ResizeObserver !== "function") { return; }
    var wrap = document.getElementById("canvaswrap");
    var width = wrap.clientWidth;
    new ResizeObserver(function () {
      if (wrap.clientWidth !== width) {
        width = wrap.clientWidth;
        fit();
      }
    }).observe(wrap);
  }

  function draw() {
    var svg = document.getElementById("canvas");
    while (svg.firstChild) { svg.removeChild(svg.firstChild); }
    var byId = {};
    graph.nodes.forEach(function (n) { byId[n.id] = n; });

    graph.nodes.forEach(function (n) {
      (n.after || []).forEach(function (dep) {
        var parent = byId[dep];
        if (!parent) { return; }
        var d = edgePath(parent, n);
        var on = selectedEdge === edgeKey(parent.id, n.id);
        var path = svgEl("path", { d: d, "class": on ? "edge edge-on" : "edge" });
        // A 1.6px stroke is nearly impossible to hit; the transparent twin is the target.
        var hit = svgEl("path", { d: d, "class": "edge-hit" });
        hit.setAttribute("data-edge", edgeKey(parent.id, n.id));
        function selectEdge(ev) {
          ev.stopPropagation();
          selectedEdge = edgeKey(parent.id, n.id);
          selected = null;
          buildInspector();
          draw();
        }
        path.addEventListener("click", selectEdge);
        hit.addEventListener("click", selectEdge);
        hit.addEventListener("dblclick", function (ev) {
          ev.stopPropagation();
          cutEdge(parent.id, n.id);
        });
        hit.addEventListener("contextmenu", function (ev) {
          showCtxMenu(ev, "Cut connection", function () { cutEdge(parent.id, n.id); });
        });
        svg.appendChild(path);
        svg.appendChild(hit);
      });
    });

    if (dragLink) {
      svg.appendChild(svgEl("path", {
        d: "M" + dragLink.x1 + "," + dragLink.y1 + "L" + dragLink.x2 + "," + dragLink.y2,
        "class": "ghost"
      }));
    }

    graph.nodes.forEach(function (n) {
      var isSelected = n.id === selected;
      var g = svgEl("g", { transform: "translate(" + n.x + "," + n.y + ")", "class": "node" });
      g.setAttribute("data-id", n.id);
      // SVG tooltips are a child <title>, not a title attribute.
      var tip = svgEl("title", {});
      tip.textContent = n.id + " · " + (TIPS[n.type] || n.type);
      g.appendChild(tip);
      var isNote = n.type === NOTE;
      var box = {
        width: NODE_W, height: NODE_H, rx: 6,
        fill: isNote ? "var(--vw-note-" + noteColor(n) + ")" : "var(--card, #1e1e1e)",
        stroke: isSelected ? "var(--accent, #6ea8fe)" : "var(--border, #3a3a3a)",
        "stroke-width": isSelected ? 2 : 1
      };
      // A dashed edge is the cheapest "this is paper, not a step" cue that survives theming.
      if (isNote) { box["stroke-dasharray"] = "5 3"; }
      g.appendChild(svgEl("rect", box));
      var kind = svgEl("text", { x: 9, y: 13, "font-size": 8, fill: "var(--muted-foreground, #9a9a9a)" });
      kind.textContent = String(n.type).toUpperCase();
      var id = svgEl("text", { x: 9, y: 26, "font-size": 11, fill: "var(--foreground, #d8d8d8)" });
      id.textContent = n.id;
      g.appendChild(kind); g.appendChild(id);
      previewLines(n).forEach(function (text, line) {
        var row = svgEl("text", {
          x: 9, y: 38 + line * 11, "font-size": 9, fill: "var(--muted-foreground, #9a9a9a)"
        });
        row.textContent = text;
        g.appendChild(row);
      });
      outputLines(n.id).forEach(function (text, line) {
        var out = svgEl("text", {
          x: 9, y: NODE_H + 12 + line * 11, "font-size": 9, fill: "var(--muted-foreground, #9a9a9a)",
          class: "vw-output"
        });
        out.textContent = text;
        g.appendChild(out);
      });

      // A note has no ports at all: it takes no part in the graph, so there is nothing to
      // drag from and nothing to drop onto.
      if (n.type !== NOTE) {
        var out = svgEl("circle", {
          cx: NODE_W, cy: NODE_H / 2, r: PORT_R, "class": "port"
        });
        out.setAttribute("data-port", "out");
        out.setAttribute("data-id", n.id);
        out.addEventListener("mousedown", function (ev) {
          // The port owns the gesture; without this the node drag starts instead.
          ev.stopPropagation();
          ev.preventDefault();
          beginLink(n, ev);
        });
        g.appendChild(out);

        if (n.type !== "trigger") {
          var inp = svgEl("circle", {
            cx: 0, cy: NODE_H / 2, r: PORT_R, "class": "port"
          });
          inp.setAttribute("data-port", "in");
          inp.setAttribute("data-id", n.id);
          inp.addEventListener("mousedown", function (ev) {
            ev.stopPropagation();
            ev.preventDefault();
            if (linkArm) { finishLink(linkArm, n.id); }
            else { note("Drag from the right port of the parent node to here."); }
          });
          g.appendChild(inp);
        }
      }

      wireNode(g, n);
      svg.appendChild(g);
    });
    if (!fitLocked) { fit(); }
  }

  function svgPoint(ev) {
    var svg = document.getElementById("canvas");
    var pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    var matrix = svg.getScreenCTM();
    return matrix ? pt.matrixTransform(matrix.inverse()) : { x: ev.clientX, y: ev.clientY };
  }

  // Right-click opens a one-item menu instead of deleting outright: the destructive
  // choice stays explicit, but still draft-level like the Delete key (only Save
  // persists anything). One menu at a time; any click closes it.
  function closeCtxMenu() {
    var open = document.querySelector(".vw-ctxmenu");
    if (open) open.remove();
    document.removeEventListener("click", closeCtxMenu);
  }

  function showCtxMenu(ev, label, action) {
    ev.preventDefault();
    ev.stopPropagation();
    closeCtxMenu();
    var menu = document.createElement("div");
    menu.className = "vw-ctxmenu";
    menu.style.position = "fixed";
    menu.style.zIndex = "60";
    menu.style.left = Math.max(0, Math.min(ev.clientX, window.innerWidth - 150)) + "px";
    menu.style.top = Math.max(0, Math.min(ev.clientY, window.innerHeight - 60)) + "px";
    var item = document.createElement("button");
    item.type = "button";
    item.className = "pill";
    item.textContent = label;
    item.addEventListener("click", function (clickEv) {
      clickEv.stopPropagation();
      closeCtxMenu();
      action();
    });
    menu.appendChild(item);
    document.body.appendChild(menu);
    document.addEventListener("click", closeCtxMenu);
  }

  function wireNode(g, n) {
    // Right-click offers Delete in a menu; the menu item does the deleting.
    g.addEventListener("contextmenu", function (ev) {
      showCtxMenu(ev, "Delete node", function () {
        selected = n.id;
        selectedEdge = null;
        removeSelected();
      });
    });
    g.addEventListener("mousedown", function (ev) {
      if (ev.button !== 0) { return; }
      // A port handler already claimed this press (stopPropagation also covers it, but a port
      // inside a child <g> must never drag the node).
      if (ev.target && ev.target.getAttribute && ev.target.getAttribute("data-port")) { return; }
      ev.preventDefault();
      fitLocked = true;
      var start = svgPoint(ev);
      var offset = { x: start.x - n.x, y: start.y - n.y };
      var moved = false;
      var frame = null;
      // One redraw per animation frame, not one per pixel: draw() rebuilds the whole SVG.
      function scheduleDraw() {
        if (frame) { return; }
        if (typeof requestAnimationFrame !== "function") { draw(); return; }
        frame = requestAnimationFrame(function () { frame = null; draw(); });
      }
      function cleanup() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        document.removeEventListener("pointercancel", cancel);
        window.removeEventListener("blur", cancel);
        if (frame && typeof cancelAnimationFrame === "function") { cancelAnimationFrame(frame); }
        frame = null;
      }
      // Released off-window / cancelled: never leave fitLocked stuck or a ghost on screen.
      function cancel() {
        cleanup();
        fitLocked = false;
        draw();
      }
      function onMove(moveEv) {
        var p = svgPoint(moveEv);
        if (Math.abs(p.x - start.x) > 3 || Math.abs(p.y - start.y) > 3) { moved = true; }
        n.x = Math.max(0, Math.round(p.x - offset.x));
        n.y = Math.max(0, Math.round(p.y - offset.y));
        scheduleDraw();
      }
      function onUp() {
        cleanup();
        fitLocked = false;
        if (!moved) { pick(n.id); } else { draw(); }
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      document.addEventListener("pointercancel", cancel);
      window.addEventListener("blur", cancel);
    });
  }

  // ------------------------------------------------------------- selection
  function pick(id) {
    selected = id;
    selectedEdge = null;
    setInspector(true);
    buildInspector();
    draw();
  }

  /** The node under a canvas point, by geometry (DOM hit-testing would trip over the edge
   *  hit-areas and the drag ghost stacked above the node). */
  function nodeIdAtPoint(p) {
    var PAD = 6;
    for (var i = graph.nodes.length - 1; i >= 0; i -= 1) {
      var n = graph.nodes[i];
      if (p.x >= n.x - PAD && p.x <= n.x + NODE_W + PAD &&
          p.y >= n.y - PAD && p.y <= n.y + NODE_H + PAD) { return n.id; }
    }
    return null;
  }

  /** Would making *to* depend on *from* close a loop? Walk up from *from*. */
  function createsCycle(from, to) {
    var seen = {}, stack = [from];
    while (stack.length) {
      var id = stack.pop();
      if (id === to) { return true; }
      if (seen[id]) { continue; }
      seen[id] = 1;
      var n = node(id);
      if (n) { stack = stack.concat(n.after || []); }
    }
    return false;
  }

  /** Drag started on *n*'s output port: follow the pointer, connect on release. */
  function beginLink(n, ev) {
    var start = svgPoint(ev), origin = outPort(n), moved = false;
    linkArm = null;
    fitLocked = true;
    dragLink = { from: n.id, x1: origin.x, y1: origin.y, x2: start.x, y2: start.y };
    draw();
    var frame = null;
    function scheduleDraw() {
      if (frame) { return; }
      if (typeof requestAnimationFrame !== "function") { draw(); return; }
      frame = requestAnimationFrame(function () { frame = null; draw(); });
    }
    function cleanup() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.removeEventListener("pointercancel", cancel);
      window.removeEventListener("blur", cancel);
      if (frame && typeof cancelAnimationFrame === "function") { cancelAnimationFrame(frame); }
      frame = null;
    }
    function cancel() {
      cleanup();
      dragLink = null;
      fitLocked = false;
      draw();
    }
    function onMove(moveEv) {
      var p = svgPoint(moveEv);
      if (Math.abs(p.x - start.x) > 3 || Math.abs(p.y - start.y) > 3) { moved = true; }
      dragLink.x2 = p.x;
      dragLink.y2 = p.y;
      scheduleDraw();
    }
    function onUp(upEv) {
      cleanup();
      var from = dragLink.from;
      dragLink = null;
      fitLocked = false;
      if (moved) {
        var targetId = nodeIdAtPoint(svgPoint(upEv));
        if (targetId && targetId !== from) { finishLink(from, targetId); }
        else { note(""); draw(); }
        return;
      }
      // A click (no drag) arms the port, so the next input-port click completes it.
      linkArm = from;
      note("Now click the input port of the node that should run after " + from + ".");
      draw();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
    document.addEventListener("pointercancel", cancel);
    window.addEventListener("blur", cancel);
  }

  /** Add the *from* -> *to* edge, refusing the three ways it could be wrong. */
  function finishLink(from, to) {
    linkArm = null;
    var source = node(from), target = node(to);
    if (!source || !target) { return; }
    if (source.type === NOTE || target.type === NOTE) {
      note("a note cannot hold a workflow step");
    } else if (target.type === "trigger") {
      note("a trigger cannot have parents");
    } else if (from === to) {
      note("a node cannot depend on itself");
    } else if (createsCycle(from, to)) {
      note("that edge would close a loop");
    } else {
      target.after = target.after || [];
      if (target.after.indexOf(from) >= 0) { note(from + " already feeds " + to); }
      else { target.after.push(from); note(from + " → " + to); }
    }
    selectedEdge = null;
    draw();
    buildInspector();
  }

  function cutEdge(from, to) {
    var target = node(to);
    if (target) {
      target.after = (target.after || []).filter(function (dep) { return dep !== from; });
    }
    selectedEdge = null;
    note("cut " + from + " → " + to);
    draw();
    buildInspector();
  }

  /** Delete the selected edge, else the selected node and every edge touching it. */
  function removeSelected() {
    if (selectedEdge) {
      var pair = JSON.parse(selectedEdge);
      cutEdge(pair[0], pair[1]);
      return true;
    }
    if (!selected) { return false; }
    var removed = selected;
    graph.nodes = graph.nodes.filter(function (n) { return n.id !== removed; });
    graph.nodes.forEach(function (n) {
      n.after = (n.after || []).filter(function (dep) { return dep !== removed; });
    });
    selected = null;
    selectedEdge = null;
    linkArm = null;
    buildInspector();
    draw();
    note("removed " + removed);
    return true;
  }

  // ------------------------------------------------------------- inspector
  /** A labelled inspector row. The tip rides on the label AND the control, so hovering
   *  either one explains it (a native title is the whole mechanism, here and in SVG). */
  function field(labelText, control, tip) {
    var wrap = document.createElement("div");
    var label = document.createElement("div");
    label.className = "label";
    label.textContent = labelText;
    if (tip) {
      label.title = tip;
      control.title = tip;
    }
    wrap.appendChild(label);
    wrap.appendChild(control);
    return wrap;
  }

  function textInput(value, onInput, placeholder) {
    var input = document.createElement("input");
    input.type = "text";
    input.value = value || "";
    if (placeholder) { input.placeholder = placeholder; }
    input.addEventListener("input", function () { onInput(input.value); });
    return input;
  }

  function textArea(value, onInput, rows) {
    var area = document.createElement("textarea");
    area.rows = rows || 4;
    area.value = value || "";
    area.addEventListener("input", function () { onInput(area.value); });
    return area;
  }

  /** Host profiles as ``[{name, label, model, provider}]``; empty when the page cannot reach
   *  the plugin API (a bare file:// preview), in which case the picker is a text field. */
  function profileByName(name) {
    if (!name) { return null; }
    var hits = profiles.filter(function (p) { return p.name === name; });
    return hits[0] || null;
  }

  function profileControl(current) {
    if (!profiles.length) {
      return textInput(current.profile || "", function (v) {
        if (v) { current.profile = v; } else { delete current.profile; }
        draw();
      }, "profile / bot id (optional)");
    }
    var select = document.createElement("select");
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "— host default —";
    select.appendChild(blank);
    var known = false;
    profiles.forEach(function (p) {
      var option = document.createElement("option");
      option.value = p.name;
      option.textContent = p.label && p.label !== p.name ? p.label + " (" + p.name + ")" : p.name;
      if (p.name === current.profile) { option.selected = true; known = true; }
      select.appendChild(option);
    });
    if (current.profile && !known) {
      var stale = document.createElement("option");
      stale.value = current.profile;
      stale.textContent = current.profile + " (not found)";
      stale.selected = true;
      select.appendChild(stale);
    }
    select.addEventListener("change", function () {
      if (select.value) { current.profile = select.value; } else { delete current.profile; }
      buildInspector();
      draw();
    });
    return select;
  }

  /** The host catalog as a grouped <select>: one optgroup per provider, because a step names
   *  exactly one model and the runtime derives its provider. Only the active provider's
   *  models are offered — anything else would fail loudly server-side. With no catalog,
   *  or an unknown active provider, the field stays typeable (fail open, never empty),
   *  and a saved model the catalog dropped stays selectable. */
  function modelSelect(current) {
    if (!models.length) {
      return textInput(current.model || "", function (v) {
        if (v) { current.model = v; } else { delete current.model; }
      }, "model id (optional)");
    }
    var offered = currentProvider
      ? models.filter(function (p) { return p.slug === currentProvider; })
      : models;
    if (!offered.length) { offered = models; }
    var select = document.createElement("select");
    select.title = TIPS["agent.model"];
    var blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "\u2014 the bot's own model \u2014";
    blank.title = TIPS["agent.model"];
    select.appendChild(blank);
    var known = false;
    offered.forEach(function (p) {
      var group = document.createElement("optgroup");
      group.label = p.label || p.slug;
      (p.models || []).forEach(function (id) {
        var option = document.createElement("option");
        option.value = id;
        option.textContent = id;
        option.title = TIPS["agent.model"];
        if (id === current.model) { option.selected = true; known = true; }
        group.appendChild(option);
      });
      if (group.children.length) { select.appendChild(group); }
    });
    if (current.model && !known) {
      // A saved design can name a model this host no longer lists: keep it visible so opening
      // the inspector cannot silently retarget the step.
      var stale = document.createElement("option");
      stale.value = current.model;
      stale.textContent = current.model + " (not listed)";
      stale.selected = true;
      select.appendChild(stale);
    }
    select.addEventListener("change", function () {
      if (select.value) { current.model = select.value; } else { delete current.model; }
      draw();
    });
    return select;
  }

  /** Best-effort profile list: same-origin when the page is served by Hermes, empty otherwise. */
  function refreshProfiles() {
    if (!window.fetch) { return; }
    window.fetch("/api/plugins/visual-workflow/profiles", { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        profiles = (data && data.profiles) || [];
        // A late catalog response must not wipe a control the user is typing in.
        var insp = document.getElementById("inspector");
        if (!insp || !insp.contains(document.activeElement)) { buildInspector(); }
      })
      .catch(function () { profiles = []; });
  }

  /** Best-effort model catalog: same-origin when Hermes serves the page, empty otherwise. */
  function refreshModels() {
    if (!window.fetch) { return; }
    window.fetch("/api/plugins/visual-workflow/models", { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        models = (data && data.providers) || [];
        currentProvider = (data && data.current && data.current["provider"]) || "";
        // A late catalog response must not wipe a control the user is typing in.
        var insp = document.getElementById("inspector");
        if (!insp || !insp.contains(document.activeElement)) { buildInspector(); }
      })
      .catch(function () { models = []; currentProvider = ""; });
  }

  /** The friendly scheduler: a preset picker, the time or day it needs, and the cron it
   *  produces. The node's own `schedule` string stays the only thing that is stored. */
  function scheduleFields(node) {
    var wrap = document.createElement("div");
    var preset = presetOf(node.schedule);
    var reading = document.createElement("p");

    var picker = document.createElement("select");
    PRESETS.forEach(function (name) {
      var option = document.createElement("option");
      option.value = name;
      option.textContent = PRESET_LABELS[name];
      option.title = TIPS["presets." + name];
      if (name === preset) { option.selected = true; }
      picker.appendChild(option);
    });
    picker.addEventListener("change", function () {
      if (picker.value !== "custom") {
        node.schedule = buildCron(picker.value, timeOf(node.schedule), weekdayOf(node.schedule));
      }
      buildInspector();
      draw();
    });
    wrap.appendChild(field("runs", picker, TIPS["trigger.preset"]));

    if (preset === "weekly") {
      var day = document.createElement("select");
      WEEKDAYS.forEach(function (pair) {
        var option = document.createElement("option");
        option.value = pair[0];
        option.textContent = pair[1];
        option.title = TIPS["trigger.weekday"];
        if (pair[0] === weekdayOf(node.schedule)) { option.selected = true; }
        day.appendChild(option);
      });
      day.addEventListener("change", function () {
        node.schedule = buildCron(preset, timeOf(node.schedule), day.value);
        buildInspector();
        draw();
      });
      wrap.appendChild(field("day", day, TIPS["trigger.weekday"]));
    }

    // Shown for hourly too: buildCron takes the MINUTE from it, so hiding the field
    // silently pinned "every hour" to :00 with no way to choose :15.
    if (preset !== "custom") {
      var time = textInput(timeOf(node.schedule), function (v) {
        if (!timeParts(v)) {
          reading.className = "error";
          reading.textContent = "time must be HH:MM (24h), e.g. 09:30";
          return;
        }
        node.schedule = buildCron(preset, v, weekdayOf(node.schedule));
        draw();
        reading.className = "hint";
        reading.textContent = describeCron(node.schedule);
      }, "09:00");
      wrap.appendChild(field("time (24h)", time, TIPS["trigger.time"]));
    }

    var cron = textInput(node.schedule || "", function (v) {
      node.schedule = v;
      draw();
      var problem = cronProblem(v);
      reading.className = problem ? "error" : "hint";
      reading.textContent = problem || describeCron(v);
    }, "0 9 * * 1-5");
    wrap.appendChild(field("cron (advanced)", cron, TIPS["trigger.schedule"]));

    var problem = cronProblem(node.schedule);
    reading.className = problem ? "error" : "hint";
    reading.textContent = problem || describeCron(node.schedule);
    reading.title = TIPS["trigger.schedule"];
    wrap.appendChild(reading);

    // This file is a standalone designer with no host: a cron expression here is a note, not a
    // job. Say so instead of letting a saved schedule look armed.
    var hostOnly = document.createElement("p");
    hostOnly.className = "hint";
    hostOnly.title = TIPS["schedule.save"];
    hostOnly.textContent = "This standalone designer only records the schedule. Save the " +
      "workflow in Hermes, then press Schedule in Hermes in the Workflows tab.";
    wrap.appendChild(hostOnly);
    return wrap;
  }

  var COND_OPS = [
    ["==", "is equal to"], ["!=", "is not equal to"],
    [">", "is greater than"], [">=", "is at least"],
    ["<", "is less than"], ["<=", "is at most"],
    ["contains", "contains"], ["startswith", "starts with"],
    ["is empty", "is empty"], ["is not empty", "is not empty"],
  ];
  // Node ids in guided mode: the Advanced toggle writes raw text instead.
  var condRaw = {};

  /** Split "node-id or node-id.dotted.path" on the longest upstream id, mirroring
   *  the runner. Upstream-only: the backend rejects anything else, so the builder
   *  never offers it. */
  function splitTarget(target, upstream) {
    var ids = (upstream || []).slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < ids.length; i++) {
      if (target === ids[i]) return { node: ids[i], field: "" };
      if (target.indexOf(ids[i] + ".") === 0) {
        return { node: ids[i], field: target.slice(ids[i].length + 1) };
      }
    }
    return null;
  }

  /** An expression the guided builder understands, or null (raw text mode keeps it). */
  function parseCondition(expr, upstream) {
    var text = String(expr || "").trim();
    var m = text.match(/^out\.(.+?)\s+is(\s+not)?\s+empty$/);
    if (m) {
      var s = splitTarget(m[1], upstream);
      if (s) return { node: s.node, field: s.field, op: m[2] ? "is not empty" : "is empty", value: "" };
      return null;
    }
    m = text.match(/^out\.(.+?)\s+(contains|startswith)\s+(.+)$/) ||
        text.match(/^out\.(.+?)\s*(==|!=|>=|<=|>|<)\s*(.+)$/);
    if (m) {
      var s2 = splitTarget(m[1], upstream);
      if (s2) return { node: s2.node, field: s2.field, op: m[2], value: m[3] };
    }
    return null;
  }

  function buildExpression(node, field, op, value) {
    var lhs = "out." + node + (field ? "." + field : "");
    if (op === "is empty" || op === "is not empty") return lhs + " " + op;
    return lhs + " " + op + " " + value;
  }

  function describeCondition(node, field, op, value) {
    var what = "output of " + node + (field ? " (" + field.split(".").join(" ") + ")" : "");
    var phrases = {
      "==": "is equal to", "!=": "is not equal to",
      ">": "is greater than", ">=": "is at least",
      "<": "is less than", "<=": "is at most",
      "contains": "contains", "startswith": "starts with",
      "is empty": "is empty", "is not empty": "is not empty",
    };
    var phrase = phrases[op] || op;
    if (op === "is empty" || op === "is not empty") return "Continue when " + what + " " + phrase + ".";
    return "Continue when " + what + " " + phrase + " " + value + ".";
  }

  /** The guided condition editor: upstream step, field path, operator, value, with a
   *  plain-English preview. Anything it cannot parse stays a free-text field. */
  function conditionBuilder(current) {
    var box = document.createElement("div");
    var upstream = (current.after || []).filter(function (id) { return !!id; });
    var parsed = parseCondition(current.expression, upstream);
    if (!parsed || condRaw[current.id] || !upstream.length) {
      var area = textArea(current.expression || "", function (v) {
        current.expression = v;
        draw();
      }, 3);
      box.appendChild(field("expression", area, TIPS["condition.expression"]));
      if (current.expression && !parsed) {
        var kept = document.createElement("p");
        kept.className = "hint";
        kept.textContent = "Kept as typed: the guided builder cannot parse this yet.";
        box.appendChild(kept);
      }
      if (!upstream.length) {
        var need = document.createElement("p");
        need.className = "hint";
        need.textContent = "Connect this condition to a step first \u2014 a test needs an upstream output.";
        box.appendChild(need);
      }
      return box;
    }
    var parts = { node: parsed.node, field: parsed.field, op: parsed.op, value: parsed.value };
    function commit() {
      current.expression = buildExpression(parts.node, parts.field, parts.op, parts.value);
      delete condRaw[current.id];
      draw();
    }
    var nodeSel = document.createElement("select");
    nodeSel.title = TIPS["condition.expression"];
    upstream.forEach(function (id) {
      var opt = document.createElement("option");
      opt.value = id;
      opt.textContent = id;
      if (id === parts.node) opt.selected = true;
      nodeSel.appendChild(opt);
    });
    nodeSel.addEventListener("change", function () {
      parts.node = nodeSel.value;
      commit();
      buildInspector();
    });
    box.appendChild(field("step", nodeSel, TIPS["condition.expression"]));
    var preview = document.createElement("p");
    preview.className = "hint";
    var echo = document.createElement("p");
    echo.className = "muted";
    function refresh() {
      preview.textContent = describeCondition(parts.node, parts.field, parts.op, parts.value);
      echo.textContent = current.expression;
    }
    var fieldInput = textInput(parts.field, function (v) {
      parts.field = v.trim();
      commit();
      refresh();
    }, "field.path (optional)");
    box.appendChild(field("field", fieldInput, TIPS["condition.expression"]));
    var opSel = document.createElement("select");
    opSel.title = TIPS["condition.expression"];
    COND_OPS.forEach(function (pair) {
      var opt = document.createElement("option");
      opt.value = pair[0];
      opt.textContent = pair[0] === pair[1] ? pair[0] : pair[0] + " \u2014 " + pair[1];
      if (pair[0] === parts.op) opt.selected = true;
      opSel.appendChild(opt);
    });
    opSel.addEventListener("change", function () {
      parts.op = opSel.value;
      commit();
      buildInspector();
    });
    box.appendChild(field("test", opSel, TIPS["condition.expression"]));
    if (parts.op !== "is empty" && parts.op !== "is not empty") {
      var valueInput = textInput(parts.value, function (v) {
        parts.value = v;
        commit();
        refresh();
      }, '100, "ship", true');
      box.appendChild(field("value", valueInput, TIPS["condition.expression"]));
    }
    refresh();
    box.appendChild(preview);
    box.appendChild(echo);
    var adv = document.createElement("button");
    adv.type = "button";
    adv.className = "pill";
    adv.textContent = "advanced: edit as text";
    adv.addEventListener("click", function () {
      condRaw[current.id] = true;
      buildInspector();
    });
    box.appendChild(adv);
    return box;
  }

  function buildInspector() {
    var box = document.getElementById("insp-body");
    box.textContent = "";
    var current = selected ? node(selected) : null;
    if (!current) {
      setInspector(false);
      var empty = document.createElement("p");
      empty.className = "muted";
      empty.textContent = "Select a node to edit it.";
      box.appendChild(empty);
      return;
    }
    var head = document.createElement("p");
    head.className = "muted";
    head.textContent = current.id + " · " + current.type;
    box.appendChild(head);

    if (current.type === NOTE) {
      box.appendChild(field("note text", textArea(current.text || "", function (v) {
        current.text = v; draw();
      }, 3), TIPS["note.text"]));
      var tint = document.createElement("select");
      tint.title = TIPS["note.color"];
      NOTE_COLORS.forEach(function (name) {
        var option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        option.title = TIPS["note.color"];
        if (noteColor(current) === name) { option.selected = true; }
        tint.appendChild(option);
      });
      tint.addEventListener("change", function () {
        current.color = tint.value;
        draw();
      });
      box.appendChild(field("colour", tint, TIPS["note.color"]));
      // Say the one thing a note is easy to be mistaken for: a step.
      var why = document.createElement("p");
      why.className = "hint";
      why.title = TIPS["note"];
      why.textContent = "A note is for people reading the canvas; it never runs.";
      box.appendChild(why);
    } else if (current.type === "trigger") {
      var select = document.createElement("select");
      select.title = TIPS["trigger.trigger_mode"];
      MODES.forEach(function (mode) {
        var option = document.createElement("option");
        option.value = mode;
        option.textContent = mode;
        option.title = TIPS["trigger.trigger_mode"];
        if (current.trigger_mode === mode) { option.selected = true; }
        select.appendChild(option);
      });
      select.addEventListener("change", function () {
        current.trigger_mode = select.value;
        buildInspector();
        draw();
      });
      box.appendChild(field("trigger_mode", select, TIPS["trigger.trigger_mode"]));
      if (current.trigger_mode === "schedule") { box.appendChild(scheduleFields(current)); }
    } else if (current.type === "agent") {
      box.appendChild(field("prompt", textArea(current.prompt || "", function (v) {
        current.prompt = v; draw();
      }, 5), TIPS["agent.prompt"]));
      box.appendChild(field("profile / bot (optional)", profileControl(current), TIPS["agent.profile"]));
      var chosen = profileByName(current.profile);
      if (chosen) {
        var runs = document.createElement("p");
        runs.className = "hint";
        runs.textContent = "runs as " + (chosen.label || chosen.name) +
          (chosen.model ? " · " + chosen.model : "");
        box.appendChild(runs);
      }
      box.appendChild(field("model (optional)", modelSelect(current), TIPS["agent.model"]));
      box.appendChild(field("retries (optional)", textInput(
        current.retries ? String(current.retries) : "",
        function (v) {
          var count = parseInt(v, 10);
          if (!v.trim() || isNaN(count) || count <= 0) { delete current.retries; }
          else { current.retries = Math.min(3, count); }
          draw();
        },
        "0"
      ), TIPS["agent.retries"]));
    } else if (current.type === "condition") {
      box.appendChild(conditionBuilder(current));
    } else if (current.type === "approval") {
      box.appendChild(field("question", textArea(current.question || "", function (v) {
        current.question = v; draw();
      }, 3), TIPS["approval.question"]));
      box.appendChild(field("context (optional)", textArea(current.context || "", function (v) {
        if (v.trim()) { current.context = v; } else { delete current.context; }
        draw();
      }, 3), TIPS["approval.context"]));
      box.appendChild(field("options (comma separated)", textInput(
        (current.options || []).join(", "),
        function (v) {
          var list = v.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          if (list.length) { current.options = list; } else { delete current.options; }
          draw();
        }, "ship, edit"), TIPS["approval.options"]));
      box.appendChild(field("timeout (minutes, optional)", textInput(
        current.timeout_minutes ? String(current.timeout_minutes) : "",
        function (v) {
          var minutes = parseInt(v, 10);
          if (!v.trim() || isNaN(minutes) || minutes <= 0) { delete current.timeout_minutes; }
          else { current.timeout_minutes = minutes; }
          draw();
        }, "60"), TIPS["approval.timeout"]));
      var policy = document.createElement("select");
      policy.title = TIPS["approval.on_timeout"];
      [["reject", "reject — fail the run"],
       ["escalate", "escalate — flag it for someone else"]].forEach(function (pair) {
        var option = document.createElement("option");
        option.value = pair[0];
        option.textContent = pair[1];
        option.title = TIPS["approval.on_timeout"];
        if ((current.on_timeout || "reject") === pair[0]) { option.selected = true; }
        policy.appendChild(option);
      });
      policy.addEventListener("change", function () {
        current.on_timeout = policy.value;
        draw();
      });
      box.appendChild(field("if it times out", policy, TIPS["approval.on_timeout"]));
    } else if (current.type === "output") {
      var parents = document.createElement("p");
      parents.className = "muted";
      parents.textContent = (current.after || []).length
        ? (current.after || []).join(", ")
        : "(no parents — this output collects nothing)";
      box.appendChild(field("parents", parents, TIPS["output.parents"]));
      if (channels.length) {
        box.appendChild(field("send to", sendToSelect(current), TIPS["output.send_to"]));
      } else {
        box.appendChild(field("send to", textInput(current.target || "", function (v) {
          applySendTo(current, v);
          draw();
        }, "telegram:8522302999"), TIPS["output.target"]));
      }
      var targetHint = document.createElement("p");
      targetHint.className = "hint";
      targetHint.textContent = channels.length
        ? "A home channel sends a notification; a chat sends there. Collect only just records the result."
        : "Bare platform for its home channel, or platform:chat id for one chat.";
      box.appendChild(targetHint);
    }
    var full = lastRunName && lastRunName === graph.name ? lastFull[current.id] : null;
    if (full) {
      // The canvas excerpt is two lines; the selected node shows everything here.
      var outLabel = document.createElement("p");
      outLabel.className = "hint";
      outLabel.textContent = "last output";
      var outPre = document.createElement("pre");
      outPre.textContent = full;
      outPre.style.maxHeight = "200px";
      outPre.style.overflow = "auto";
      box.appendChild(outLabel);
      box.appendChild(outPre);
    }
  }

  // -------------------------------------------------------------- feedback
  /** A one-word status in the detail box. Never write into a hidden box: a note nobody
   *  can see is the same as no note at all. */
  function note(message) {
    var box = document.getElementById("status");
    box.textContent = message || "";
    box.hidden = !message;
  }

  /** A run's outcome, pinned above the canvas until dismissed or replaced. `note()` writes
   *  one word into the detail box and is wiped by the next action, so a failed or paused run
   *  was invisible unless you happened to be looking there. `kind` is "info" | "warn" |
   *  "error"; an empty message hides the banner. */
  function banner(message, kind) {
    var box = document.getElementById("banner");
    box.textContent = "";
    if (!message) {
      box.hidden = true;
      box.className = "";
      return;
    }
    box.hidden = false;
    box.className = kind || "";
    var text = document.createElement("p");
    text.textContent = message;
    box.appendChild(text);
    var close = document.createElement("button");
    close.type = "button";
    close.className = "pill";
    close.textContent = "✕";
    close.title = "Dismiss this message.";
    close.setAttribute("aria-label", "Dismiss message");
    close.addEventListener("click", function () { banner(""); });
    box.appendChild(close);
  }

  /** The one place a validation verdict is announced: banner first, details second. */
  function reportValid(errors) {
    showErrors(errors);
    if (!errors.length) {
      note("valid");
      banner("Design is valid · " + graph.nodes.length + " node(s).", "");
      return false;
    }
    note(errors.length + " problem(s)");
    banner("Not valid · " + errors.length + " problem(s) — see the details below the canvas.", "error");
    return true;
  }

  function showErrors(errors) {
    var box = document.getElementById("errors");
    if (!errors.length) {
      box.textContent = "";
      box.hidden = true;
      return;
    }
    box.hidden = false;
    box.textContent = errors.map(function (e) {
      return (e.node ? e.node + ": " : "") + e.field + " — " + e.msg;
    }).join("\n");
  }

  // -------------------------------------------------------------- run
  var API = "/api/plugins/visual-workflow";
  var savedNames = null;  // designs the backend has; null until the list has actually loaded

  /** Chats the host gateway has seen (``GET /channels``); empty means the output inspector
   *  falls back to a typed target instead of a picker that cannot fill. */
  function refreshChannels() {
    if (!window.fetch) { return; }
    window.fetch(API + "/channels", { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        channels = (data && data.channels) || [];
        // A late catalog response must not wipe a control the user is typing in.
        var insp = document.getElementById("inspector");
        if (!insp || !insp.contains(document.activeElement)) { buildInspector(); }
      })
      .catch(function () { channels = []; });
  }

  /** Remember which names are saved: a draft has no server-side design to run.
   *  Returns the request so Run can refresh a list loaded earlier in the session. */
  function refreshDesigns() {
    if (!window.fetch) { return null; }
    return window.fetch(API + "/designs", { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) { savedNames = Array.isArray(data && data.designs) ? data.designs : []; })
      .catch(function () { savedNames = null; });  // unknown, not "nothing is saved"
  }

  /** A small run-panel action button (the widget has no framework to build one). */
  function runButton(label, onClick) {
    var node = document.createElement("button");
    node.type = "button";
    node.className = "pill";
    node.textContent = label;
    node.addEventListener("click", onClick);
    return node;
  }

  /** One line of the run panel. */
  function runLine(tag, text, cls) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    node.textContent = text;
    return node;
  }

  /** Announce a run's outcome and, when it pauses, put the way to resume it right there. A
   *  run that only says "go to chat" is a dead end; a run that quietly waits looks broken. */
  function renderRun(result) {
    var status = result.status;
    var runId = result.run_id || "";
    lastRunId = runId;
    lastStatus = String(status || "");
    if (result && result.outputs && Object.keys(result.outputs).length) {
      lastOutputs = summarizeOutputs(result);
      lastFull = fullOutputs(result);
      lastRunName = result.name || graph.name;
      draw();
    } else {
      // No outputs in this mount (a fresh failure, a parked gate): drop the previous
      // run's excerpts instead of showing stale text next to a new verdict.
      lastOutputs = {};
      lastFull = {};
      lastRunName = "";
    }
    var box = document.getElementById("run");
    box.textContent = "";
    box.hidden = false;
    if (status === "awaiting_approval") {
      var gate = result.pending || {};
      banner("Run " + runId + " paused at gate " + gate.node_id + " — answer it below.", "warn");
      box.appendChild(runLine("h4", "gate " + gate.node_id + ": " + (gate.question || "")));
      // The context is the material being approved; dropping it asks for a decision with
      // less information than the backend already sent.
      if (gate.context) { box.appendChild(runLine("pre", gate.context)); }
      var options = gate.options || [];
      if (options.length) {
        var row = document.createElement("div");
        options.forEach(function (option) {
          var pick = runButton(option, function () { respond(gate.node_id, option); });
          pick.title = TIPS["runs.approve"];
          row.appendChild(pick);
        });
        box.appendChild(row);
      } else {
        box.appendChild(runLine("p", "Type the answer and press send.", "hint"));
        var free = document.createElement("textarea");
        free.rows = 2;
        free.setAttribute("aria-label", "answer for gate " + gate.node_id);
        box.appendChild(free);
        var sendFree = runButton("Send result & resume", function () {
          respond(gate.node_id, free.value);
        });
        sendFree.title = TIPS["runs.resume"];
        box.appendChild(sendFree);
      }
      box.appendChild(runLine("p", "Or answer it from chat with workflow_design_respond.", "hint"));
      return;
    }
    if (status === "awaiting_agent") {
      var step = result.pending || {};
      // A parked agent step means no agent backend was around when the run needed it (an
      // older parked run, or the backend was briefly unavailable). Resume either way: let
      // the agent produce the step now, or paste the result yourself.
      banner("Run " + runId + " paused at agent step " + step.node_id +
        " — run this step with the agent, or paste its result below (or run the workflow from chat).", "warn");
      box.appendChild(runLine("h4", "agent step " + step.node_id + " is waiting"));
      if (step.prompt) { box.appendChild(runLine("pre", step.prompt)); }
      if (step.context) { box.appendChild(runLine("pre", step.context)); }
      var agentRun = runButton("Run this step with the agent", function () { respondByAgent(step.node_id); });
      agentRun.title = TIPS["runs.agent"];
      box.appendChild(agentRun);
