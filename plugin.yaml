name: visual-workflow
version: "1.1.0"
description: "Visual drag-and-drop agent-workflow designer for Hermes: Trigger, Agent, Condition, Approval, Output nodes on a canvas, executed by a plugin-owned sequential runner."
author: Printaga Publishing LLC
license: Apache-2.0
requires_hermes: ">=0.21"
kind: standalone
homepage: https://pluginsforhermes.com/
provides_tools:
  - workflow_design_save
  - workflow_design_load
  - workflow_design_validate
  - workflow_design_run
  - workflow_design_respond
provides_hooks:
  - pre_tool_call
