[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-workflow-hermes"
version = "1.0.0"
description = "Visual agent-workflow designer plugin for Hermes"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -m pytest` puts CWD on sys.path but bare `pytest` does not; pin the plugin root so
# `import visual_workflow_hermes` resolves either way.
pythonpath = ["."]

[tool.setuptools]
# Flat layout also holds non-package dirs (widgets/, examples/, tests/);
# declare the one real package so enable-time `uv sync` builds cleanly.
packages = ["visual_workflow_hermes"]

# The canvas and templates are runtime assets, not importable modules. ``runtime._widget_hint``
# and ``dashboard/plugin_api.TEMPLATES_DIR`` fall back to ``sys.prefix`` when the source
# checkout is absent, so a wheel install still opens the real designer and lists templates.
[tool.setuptools.data-files]
"widgets" = ["widgets/designer.html"]
"examples" = ["examples/*.designer.json"]
